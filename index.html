<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARCHTYPE — 3D Type Columns</title>
  <link rel="stylesheet" href="style.css?v=5" />
  <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <!-- Overlay Drag & Drop Font -->
    <div id="drop-overlay" class="drop-overlay" hidden>
      <div class="drop-overlay-box" data-i18n="dropFontHint">RILASCIA QUI IL FILE FONT (.OTF / .TTF / .WOFF)</div>
    </div>

    <!-- Titolo in alto a sinistra formattato come nella reference: A    RCH  T   Y   PE -->
    <header id="top-header" aria-label="ARCHTYPE">
      <div id="archtype-title">
        <span class="title-seg seg-a">A</span>
        <span class="title-seg seg-rch">RCH</span>
        <span class="title-seg seg-t">T</span>
        <span class="title-seg seg-y">Y</span>
        <span class="title-seg seg-pe">PE</span>
      </div>
    </header>

    <!-- Due Colonne Controlli a Sinistra -->
    <div id="left-panels">
      <!-- COLONNA 1: Font, Box di Testo, 7 Slider Globali, Resetta Globale -->
      <aside class="panel-col">
        <div class="font-section">
          <label class="link-btn" id="lbl-upload-font">
            <span data-i18n="uploadFont">UPLOAD FONT</span>
            <input id="font-upload" type="file" accept=".ttf,.otf,.woff" hidden />
          </label>

          <!-- Menù selezione font piatto con bordo nero e filetti divisori -->
          <div class="font-dropdown" id="font-dropdown">
            <button type="button" class="font-dropdown-trigger" id="font-dropdown-btn" aria-expanded="false">
              <span id="font-selected-label">GAISYR</span>
              <svg class="select-chevron" viewBox="0 0 14 8" width="12" height="7" fill="none" stroke="currentColor" stroke-width="1.2">
                <polyline points="1,1 7,7 13,1" />
              </svg>
            </button>
            <div class="font-dropdown-menu" id="font-dropdown-menu" hidden>
              <button type="button" class="font-option active" data-preset="0" hidden>GAISYR</button>
              <button type="button" class="font-option" data-preset="1">WALTER</button>
              <button type="button" class="font-option" data-preset="2">CONNECT</button>
              <button type="button" class="font-option" data-preset="3">GROW</button>
            </div>
          </div>
        </div>

        <div class="textbox-section">
          <textarea
            id="text-input"
            rows="4"
            placeholder="SCRIVI QUI"
            autocomplete="off"
            spellcheck="false"
          >SCRIVI
QUI</textarea>
        </div>

        <div class="sliders-section" id="global-sliders">
          <div class="slider-item" data-key="height">
            <div class="slider-label" data-i18n="height">ALTEZZA</div>
            <div class="slider-track-wrap">
              <div class="slider-line"></div>
              <div class="slider-thumb"></div>
            </div>
          </div>

          <div class="slider-item" data-key="width">
            <div class="slider-label" data-i18n="width">LARGHEZZA</div>
            <div class="slider-track-wrap">
              <div class="slider-line"></div>
              <div class="slider-thumb"></div>
            </div>
          </div>

          <div class="slider-item" data-key="rotation">
            <div class="slider-label" data-i18n="rotation">TORSIONE</div>
            <div class="slider-track-wrap">
              <div class="slider-line"></div>
              <div class="slider-thumb"></div>
            </div>
          </div>

          <div class="slider-item" data-key="entasi">
            <div class="slider-label" data-i18n="entasi">RIGONFIAMENTO</div>
            <div class="slider-track-wrap">
              <div class="slider-line"></div>
              <div class="slider-thumb"></div>
            </div>
          </div>

          <div class="slider-item" data-key="density">
            <div class="slider-label" data-i18n="density">DENSITÀ</div>
            <div class="slider-track-wrap">
              <div class="slider-line"></div>
              <div class="slider-thumb"></div>
            </div>
          </div>

          <div class="slider-item" data-key="thickness">
            <div class="slider-label" data-i18n="thickness">SPESSORE</div>
            <div class="slider-track-wrap">
              <div class="slider-line"></div>
              <div class="slider-thumb"></div>
            </div>
          </div>

          <div class="slider-item" id="slider-distance-item" data-key="distance">
            <div class="slider-label" data-i18n="distance">DISTANZA</div>
            <div class="slider-track-wrap">
              <div class="slider-line"></div>
              <div class="slider-thumb"></div>
            </div>
          </div>
        </div>

        <div class="col-footer">
          <button type="button" id="btn-reset-global" class="link-btn is-hidden" data-i18n="resetGlobal">
            RESETTA GLOBALE
          </button>
        </div>
      </aside>

      <!-- COLONNA 2: Selettore Circolare Colonna & Visualizzatore/Editor a Colonna -->
      <section class="panel-col">
        <div class="col-selector-header">
          <div class="section-heading" data-i18n="selectColumn">SELEZIONA COLONNA</div>
          <div class="circle-orbit-stage" id="circle-orbit-stage" title="CLICCA PER SELEZIONARE • TRASCINA PER RUOTARE">
            <div class="orbit-guide-ring"></div>
            <div id="column-circles" class="column-circles"></div>
          </div>
        </div>

        <div class="col-visualizer-block" id="col-visualizer-block">
          <div class="section-heading" data-i18n="editColumn">MODIFICA COLONNA</div>
          <div class="visualizer-box" id="visualizer-box">
            <svg id="column-editor-svg"></svg>
          </div>
        </div>

        <div class="col-footer">
          <button type="button" id="btn-reset-column" class="link-btn is-hidden" data-i18n="resetColumn">
            RESETTA FORMA
          </button>
        </div>
      </section>
    </div>

    <!-- Viewport 3D Smarginato (Full-Bleed) -->
    <main id="viewport">
      <!-- Navigatore 3D sopra al viewport con effetto in negativo -->
      <div id="nav-sphere-wrap" class="blend-negative" title="TRASCINA PER RUOTARE • DOPPIO CLICK PER RESET">
        <canvas id="nav-sphere-canvas" width="114" height="114"></canvas>
      </div>

      <!-- Controlli in basso a sinistra sopra al viewport in negativo -->
      <div class="viewport-bottom-left blend-negative">
        <button type="button" id="btn-dark-mode" class="link-btn neg-btn" data-i18n="night">
          NOTTE
        </button>
        <button type="button" id="btn-lang-toggle" class="link-btn neg-btn">
          ENG
        </button>
      </div>

      <!-- Pannello Dimensioni PNG Personalizzate -->
      <div id="png-export-popover" class="export-popover" hidden>
        <div class="popover-title" data-i18n="customPngTitle">DIMENSIONI PNG (PX)</div>
        <div class="popover-presets">
          <button type="button" class="preset-btn" data-w="2000" data-h="2000">1:1</button>
          <button type="button" class="preset-btn" data-w="2480" data-h="3508">A4</button>
          <button type="button" class="preset-btn" data-w="3840" data-h="2160">16:9</button>
          <button type="button" class="preset-btn" id="btn-preset-screen" data-i18n="screen">SCHERMO</button>
          <button type="button" class="preset-btn active" id="btn-preset-custom" data-i18n="customRatio">CUSTOM</button>
        </div>
        <div class="popover-inputs">
          <label>
            <span>W</span>
            <input type="number" id="png-width-input" min="200" max="6000" step="1" value="2400" />
          </label>
          <button type="button" id="btn-lock-ratio" class="ratio-lock-btn" aria-pressed="true" title="BLOCCA PROPORZIONI">
            <!-- Icona Lucchetto Chiuso -->
            <svg class="icon-locked" viewBox="0 0 14 16" width="12" height="14" fill="none" stroke="currentColor" stroke-width="1.2">
              <rect x="2" y="7" width="10" height="8" />
              <path d="M4.5 7V4.5a2.5 2.5 0 0 1 5 0V7" />
            </svg>
            <!-- Icona Lucchetto Aperto -->
            <svg class="icon-unlocked" viewBox="0 0 14 16" width="12" height="14" fill="none" stroke="currentColor" stroke-width="1.2" hidden>
              <rect x="2" y="7" width="10" height="8" />
              <path d="M4.5 7V4.5a2.5 2.5 0 0 1 5 0" />
            </svg>
          </button>
          <label>
            <span>H</span>
            <input type="number" id="png-height-input" min="200" max="6000" step="1" value="3000" />
          </label>
        </div>
        <button type="button" id="btn-confirm-png" class="popover-action-btn" data-i18n="exportHqPng">
          ESPORTA PNG HQ
        </button>
      </div>

      <!-- Controlli in basso a destra sopra al viewport in negativo -->
      <div class="viewport-bottom-right blend-negative">
        <button type="button" id="btn-toggle-png" class="link-btn neg-btn" data-i18n="downloadPng">
          DOWNLOAD PNG
        </button>
        <button type="button" id="btn-export-pdf" class="link-btn neg-btn" data-i18n="downloadPdf">
          DOWNLOAD PDF
        </button>
      </div>
    </main>
  </div>

  <script type="module" src="script.js?v=5"></script>
</body>
</html>
